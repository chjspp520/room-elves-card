background: center / cover no-repeat url("/local/ha_background.jpg") fixed
views:
  - type: sections
    title: Home
    path: Home
    sections:
      - type: grid
        cards:
          - type: custom:room-elves-card
            primary_text_variant: minimal
            theme: input_select.theme
            dark_light_theme: dark,light
            head_columns: 7
            head_columns_2: 5
            primary: true
            primary_update_interval: 10
            dock_trigger_position: 42.3%
            head: true
            icon_animation: input_select.icon_animation_mode
            mobile_kiosk_entity: input_boolean.full
            show_animation: input_boolean.show_animation
            performance_mode: input_select.performance_mode
            api_base_url: /api/ha_data_store/
            key: 27d8e81de2f84b3eb225689b4d5d3db2
            report: input_button.report
            report_unique_priority: room
            report_name_priority: name,alias,entity
            style:
              - class: room-card
                height: 210px
                width: 100%
                top: -22px
              - selector: .overview-control-popup .card-right
                min-width: 150px;
                max-width: 150px;
            heartbeat_packet:
              entity: input_number.api_gateway_heartbeat_counter
              whether_send: input_boolean.api_gateway_man_close
              interval: 10
              show_breathe: true
            notice:
              style:
                - width: 100%
                - height: 20px
              stay_time: 3000
              scroll_duration: 3000
              scroll: true
              update_interval: open
              items:
                - content: >-
                    {% set status =
                    states('sensor.hashu_ju_tong_yi_cun_chu_xi_tong_today_family_status')
                    %} {% if status not in ['unknown', 'unavailable', 'none'] %}
                     ?{{ status }}
                    {% else %}
                     {{ status }}
                    {% endif %}
                  tap_action:
                    action: popup_card
                    popup_position: center
                    card:
                      type: daily_report
                      entity: >-
                        sensor.hashu_ju_tong_yi_cun_chu_xi_tong_today_family_status
                      refresh: >-
                        button.hashu_ju_tong_yi_cun_chu_xi_tong_generate_today_family_status
                      env_from_config_id: env
                      hide_room: 次卧外,儿童房外,楼道,客厅外
                      width: 400px
                      name: 今日家庭日报
                - content: >-
                    {% set eid =
                    'sensor.hashu_ju_tong_yi_cun_chu_xi_tong_frontend_card_entities_health'
                    %}

                    {% set total = state_attr(eid, 'total') | int(0) %}

                    {% set online = state_attr(eid, 'online') | int(0) %}

                    {% set offline = state_attr(eid, 'offline') | int(0) %}

                    {% set unknown = state_attr(eid, 'unknown') | int(0) %}

                    {% if offline > 0 or unknown > 0 %}
                      ?实体健康：共 <span style="border-radius: 3px; padding: 0 4px;">{{ total }}</span> 个，在线 <span style="background-color: #e8f8f0; color: #27ae60; border-radius: 3px; padding: 0 4px; font-weight: bold;">{{ online }}</span> 个{% if offline > 0 %}，离线 <span style="background-color: #fdecea; color: #e74c3c; border-radius: 3px; padding: 0 4px; font-weight: bold;">{{ offline }}</span> 个{% endif %}{% if unknown > 0 %}，未知 <span style="background-color: #fef9e7; color: #f39c12; border-radius: 3px; padding: 0 4px; font-weight: bold;">{{ unknown }}</span> 个{% endif %}
                    {% else %}
                      ?实体健康：共 <span style="border-radius: 3px; padding: 0 4px; font-weight: bold;">{{ total }}</span> 个，全部在线
                    {% endif %}
                  tap_action:
                    action: popup_card
                    popup_position: center
                    width: 400px
                    card:
                      type: entities_health
                      hide_room: 次卧外,儿童房外,楼道,客厅外
                      unique_priority: room
                      entity: >-
                        sensor.hashu_ju_tong_yi_cun_chu_xi_tong_frontend_card_entities_health
                - content: >-
                    {% set balance_raw = states('sensor.ele_6103231959710') %}
                    {% set
                     balance = balance_raw | float(0) %} {% set text_color = '#d9383a' if
                     balance < 20 else '#006e54' %}

                     ?电费余额：<span style="color: {{ text_color }}; font-weight: bold;">{{ balance_raw }} 元</span>， 可用{{
                     states('sensor.dian_fei_zhang_hu_6103231959710_yu_ji_ke_yong') }}天，
                     本月用电：{{
                     states('sensor.dian_fei_zhang_hu_6103231959710_mei_yue_dian_liang') }}
                     kWh， {{ states('sensor.dian_fei_zhang_hu_6103231959710_mei_ri_dian_liang') }}
                     kWh/日
                  tap_action:
                    card_config:
                      from_config_id: ele
                      get_type: all
                    card_params:
                      initial_tab: '1'
                - content: >-
                    {% set sensor = 'sensor.gas_0814832321_day_data' %}

                    {% set balance = state_attr(sensor, 'raw') | float(0) %}


                    {# 如果state是翻译格式，直接取state的值 #}

                    {% if balance == 0 %}
                      {% set balance = states(sensor) | float(0) %}
                    {% endif %}


                    {% set daylist = state_attr(sensor, 'daylist') %}


                    {# 根据余额动态设置文字颜色 #}

                    {% set text_color = '#d9383a' if balance < 20 else '#006e54'
                    %}


                    ?天然气余额：<span style="color: {{ text_color }}; font-weight:
                    bold;">{{ balance }} 元</span>， 


                    {%- if daylist and daylist | length > 0 %}
                      {# 提取usage和cost列表 #}
                      {%- set usage_list = daylist | map(attribute='usage') | map('float') | list %}
                      {%- set cost_list = daylist | map(attribute='cost') | map('float') | list %}
                      
                      {# 计算平均每日用量和费用 #}
                      {%- set avg_usage = usage_list | sum / usage_list | length %}
                      {%- set avg_cost = cost_list | sum / cost_list | length %}
                      
                      {# 根据平均每日费用计算可用天数 #}
                      {%- set days_left = (balance / avg_cost) | round(0) if avg_cost > 0 else 0 %}
                      
                      可用 {{ days_left }} 天， {{ avg_usage | round(2) }} m3/日
                    {%- else %}
                      暂无历史数据无法预测
                    {%- endif %}
                  tap_action:
                    card_config:
                      from_config_id: ele
                      get_type: all
                    card_params:
                      initial_tab: '2'
            dock:
              - name: 统一数据存储api
                primary: API
                entity: input_boolean.api_gateway_man_close
                on_icon: mdi:lan-connect
                off_icon: mdi:lan-disconnect
                on_color: '#007b43'
                off_color: '#b94047'
                tap_action:
                  action: toggle
              - name: 远程桌面RDP-TCP
                primary: RDP
                entity: >-
                  switch.nps_server_2_pc_tcp_tcp_192_168_1_34_3389
                on_icon: mdi:lan-connect
                on_color: '#b94047'
                off_icon: mdi:ethernet-off
                off_color: '#007b43'
                tap_action:
                  action: toggle
              - name: 全屏设置
                primary: 全屏
                entity: input_boolean.full
                on_icon: mdi:fullscreen
                on_color: '#007b43'
                off_icon: mdi:fullscreen-exit
                off_color: '#b94047'
                tap_action:
                  action: toggle
              - type: dynamic_icon
                name: 天气卡片
                loop_display: false
                show_badge: false
                icon: mdi:weather-cloudy
                preset: qweather
                entity: weather.qweather_pro_wei_yang_weather
                primary: >
                  {{state_attr('weather.qweather_pro_wei_yang_weather',
                  'condition_cn')}}
                tap_action:
                  action: popup_card
                  popup_position: center
                  width: 400px
                  card:
                    name: 西安
                    type: custom:qweather-card
                    entity: weather.qweather_pro_wei_yang_weather
              - type: dynamic_icon
                primary: dynamic
                display_time: 3
                rules:
                  - primary: >-
                      {{ states('sensor.ele_6103231959710') | float | round(0)
                      }}元
                    icon: mdi:transmission-tower
                    icon_text: 电费
                    color: >
                      {% set state = states('sensor.ele_6103231959710') |
                      float(0) %} {% if state < 30 %}
                        #e60033
                      {% elif state <= 50 %}
                        #f58220
                      {% else %}
                        #007b43
                      {% endif %}
                    animation: blink
                    tap_action:
                      card_config:
                        from_config_id: ele
                        get_type: all
                      card_params:
                        initial_tab: '1'
                  - primary: >-
                      {{ states('sensor.gas_0814832321_balance') | float |
                      round(0) }}元
                    icon: mdi:gas-burner
                    icon_text: 气费
                    color: >
                      {% set state = states('sensor.gas_0814832321_balance') |
                      float(0) %} {% if state < 20 %}
                        #e60033
                      {% elif state <= 50 %}
                        #f58220
                      {% else %}
                        #007b43
                      {% endif %}
                    animation: blink
                    tap_action:
                      card_config:
                        from_config_id: ele
                        get_type: all
                      card_params:
                        initial_tab: '2'
              - primary: 小爱同学
                icon: mdi:account-voice
                tap_action:
                  action: popup_card
                  popup_position: center
                  width: 400px
                  card:
                    type: xiaoai_conversation
                    show_conversation: true
                    conversation_page_days: 7
                    conversation_max_height: 700px
                    conversation_width: 100%
                    multiple_conversations:
                      - name: 客厅小爱
                        icon: mdi:home-floor-1
                        entity: sensor.xiaomi_oh2p_dac5_conversation
                        command_entity: text.xiaomi_oh2p_dac5_execute_text_directive
                        play_text_entity: text.xiaomi_oh2p_dac5_play_text
                        quick_input:
                          - 关闭客厅大灯
                          - 关闭餐厅吊灯和壁灯
                          - 关闭主卧吸顶灯
                          - 关闭主卧空调
                          - 关闭儿童房空调
                          - 打开客厅大灯
                      - name: 2楼小爱
                        icon: mdi:home-floor-2
                        entity: sensor.xiaomi_oh2p_dac5_conversation
                        command_entity: text.xiaomi_oh2p_dac5_execute_text_directive
                        play_text_entity: text.xiaomi_oh2p_dac5_play_text
            overview:
              - recently-used: >-
                  sensor.hashu_ju_tong_yi_cun_chu_xi_tong_jin_qi_shi_yong_she_bei
                width: 400px
              - automations: sensor.ha_data_store_automation
                width: 400px
                name: 自动化管理
              - overview_info: sensor.hashu_ju_tong_yi_cun_chu_xi_tong_today_family_status
              - type: environment
                name: 环境
                icon: mdi:thermometer-water
                rooms:
                  户外:
                    temperature: sensor.ketingwaiyangmian_wendu
                    humidity: sensor.ketingwaiyangmian_shidu
                  客厅:
                    temperature: sensor.keting_wendu
                    humidity: sensor.keting_shidu
              - type: consumables
                name: 耗材
                icon: mdi:battery
                condition:
                  - <10
              - type: person
                name: 人在
                icon: mdi:run
                rooms:
                  客厅: switch.giot_cn_1126348886_v64ksm_on_p_10_1
                  餐厅: binary_sensor.canting_renzai
                  厨房: binary_sensor.chufang_you_ren
                  儿童房: binary_sensor.ertongfang_you_ren
                  主卧: binary_sensor.zhuwo_renzai
                  次卧: binary_sensor.ciwo_renzai
                  大卫生间: binary_sensor.daweishengjian_renzai
                  小卫生间: binary_sensor.xiaoweishengjian_renzai
                person:
                  - name: Alix
                    entity: device_tracker.ip15_94
                  - name: SPP
                    entity: device_tracker.spp_39
              - automatic_folding_ha_info: true
              - type: energy
                name: 能耗
                fold: true
                icon: mdi:gas-burner
                utilities:
                  天然气:
                    entity: sensor.gas_0814832321_today_usage
                    icon: mdi:gas-burner
                    cost_entity: sensor.gas_0814832321_day_data
                    tap_action:
                      card_config:
                        from_config_id: ele
                        get_type: all
                      card_params:
                        initial_tab: '2'
                  燃气灶:
                    icon: mdi:water-boiler
                    level: 2
                    content: >-
                      今日：{{ states('sensor.gas_0814832321_youyanji') | float(0)
                      | round(2) }}m3
                  热水器:
                    icon: mdi:gas-burner
                    level: 2
                    content: >-
                      今日：{{ states('sensor.gas_0814832321_reshuiqi') | float(0)
                      | round(2) }}m3
                  电力:
                    entity: sensor.ele_6103231959710
                    icon: mdi:transmission-tower-import
                    tap_action:
                      card_config:
                        from_config_id: ele
                        get_type: all
                      card_params:
                        initial_tab: '1'
                    power: sensor.quanwu_zongglv
                    power_onsumption: sensor.quan_wu_ri_yong_dian_liang
                    hide_room: 儿童房外,次卧外,楼道,客厅外
                  空调:
                    icon: mdi:air-conditioner
                    level: 2
                    content: >-
                      {% set power = states('sensor.kong_diao_zong_gong_lu') |
                      float(0) %} {% if
                      state_attr('sensor.kong_diao_zong_gong_lu',
                      'unit_of_measurement') == 'W' %}
                        {% set power_kw = power / 1000 %}
                      {% else %}
                        {% set power_kw = power %}
                      {% endif %} 今日：{{
                      states('sensor.suo_you_kong_diao_ri_yong_dian_liang') |
                      float(0) | round(1) }}kWh | 功率：{{ power_kw | round(1) }}kw
                    tap_action:
                      card_config:
                        from_config_id: ac
                        get_type: all
                  服务器:
                    icon: mdi:server
                    level: 2
                    content: >-
                      {% set value =
                      states('sensor.cuco_cn_944196247_v3_electric_power_p_11_2')
                      | float(0) %} 今日：{{ states('sensor.fuwuqi_day') | float(0)
                      | round(1) }}kWh｜功率： {%- if value < 1000 -%}
                        {{ value | round(0) }}W
                      {%- else -%}
                        {{ (value / 1000) | round(1) }}kW
                      {%- endif -%}
                    tap_action:
                      card_config:
                        from_config_id: fuwuqi
                        get_type: all
              - type: weather
                height: 300px
                weather:
                  - name: 未央区
                    entity: weather.qweather_pro_wei_yang_weather
                  - name: 西乡县
                    entity: weather.qweather_pro_xi_xiang_weather
              - type: overview_device
                icon: mdi:countertop
                name: 厨具开启数量
                condition:
                  - 'on'
                  - Delay
                  - Keep Warm
                  - Busy
                entities:
                  - entity: sensor.chunmi_cn_404489380_eh1_status_p_2_1
                    name: 电饭锅
                  - entity: switch.kongqizhaguo
                    name: 空气炸锅
                  - entity: switch.weibolu
                    name: 微波炉
                  - entity: switch.youyanji
                    name: 油烟机
                  - entity: switch.reshuiqi
                    name: 热水器
                  - entity: input_boolean.shao_shui_hu
                    name: 烧水壶
                  - entity: switch.canting_bingxiang_chazuo
                    name: 冰箱
                tap_action:
                  action: call-service
                  service: modern_room_card.show_free_layout_popup
                  service_data:
                    title: 全部厨具
                    width: 430px
                    popup_position: center
                    display_only:
                      - 'on'
                      - Delay
                      - Keep Warm
                      - Busy
                    auto_redirect: true
                    tabs:
                      - tabs_config:
                          from_config_id:
                            - config_id: dian_fan_guo
                              name: 电饭锅
                            - config_id: kong_qi_zhaguo
                              name: 空气炸锅
                            - config_id: wei_bo_lu
                              name: 微波炉
                            - config_id: you_yan_ji
                              name: 油烟机
                            - config_id: re_shui_qi
                              name: 热水器
                            - config_id: shao_shui_hu
                              name: 烧水壶
                            - config_id: bingxiang
                              name: 冰箱
              - type: overview_device
                icon: mdi:server
                name: 服务器开启数量
                condition: 'on'
                entities:
                  - entity: binary_sensor.192_168_1_1
                    name: 软路由
                  - entity: binary_sensor.192_168_1_223
                    name: Gen8
                  - entity: binary_sensor.192_168_1_37
                    name: 备份
                  - entity: binary_sensor.192_168_1_12
                    name: 飞牛
                  - entity: binary_sensor.192_168_1_90
                    name: Exsi
                  - entity: binary_sensor.192_168_1_61
                    name: 下载机
                  - entity: binary_sensor.192_168_1_62
                    name: 微信
                  - entity: binary_sensor.192_168_1_102
                    name: HA
                tap_action:
                  card_config:
                    from_config_id: fuwuqi
                    get_type: all
              - type: overview_device
                show_card: false
                show_badge: false
                icon: mdi:video
                name: C700摄像头
                condition: 'on'
                entities:
                  - entity: switch.giot_cn_1124641761_v6shsm_on_p_2_1
                    name: C700摄像头
                tap_action:
                  card_config:
                    from_config_id: c700
                    get_type: all
              - type: overview_device
                show_card: false
                show_badge: false
                icon: mdi:run
                name: 全屋人在
                condition: 'on'
                entities:
                  - entity: switch.giot_cn_1126348886_v64ksm_on_p_10_1
                    name: 客厅
                  - entity: binary_sensor.canting_renzai
                    name: 餐厅
                  - entity: binary_sensor.chufang_you_ren
                    name: 厨房
                  - entity: binary_sensor.ertongfang_you_ren
                    name: 儿童房
                  - entity: binary_sensor.zhuwo_renzai
                    name: 主卧
                  - entity: binary_sensor.ciwo_renzai
                    name: 次卧
                  - entity: binary_sensor.daweishengjian_renzai
                    name: 大卫
                  - entity: binary_sensor.xiaoweishengjian_renzai
                    name: 小卫
              - type: entities_health
                entity: >-
                  sensor.hashu_ju_tong_yi_cun_chu_xi_tong_frontend_card_entities_health
                hide_room: 次卧外,儿童房外,楼道,客厅外
                name: 实体健康
                icon: mdi:heart-pulse
                width: 400px
                show_card: true
            buttons:
              - type: card
                row_column: 1,2-1
                card_config:
                  type: user
                  persons:
                    - entity: person.alix
                      at_home: device_tracker.ip15_94
                      location: sensor.15pro_geocoded_location
                      location_display_field_entity: input_select.user_location_field
                      phone_wifi: sensor.15pro_ssid
                      phone_battery: sensor.15pro_battery_state
                      phone_battery_level: sensor.15pro_battery_level
                    - entity: person.spp
                      at_home: device_tracker.spp_39
                  bubble_map_show_navigation:
                    - alix → spp
                    - spp → alix
                  location:
                    show_location: input_boolean.show_local
                    bubble_map_type: ampa
                  weather:
                    - name: 未央区
                      entity: weather.qweather_pro_wei_yang_weather
                    - name: 西乡县
                      entity: weather.qweather_pro_xi_xiang_weather
                  navigation:
                    auto_load_maps: input_boolean.auto_load_maps
                    amap_web_key: b44ef34cee0274f46b9cc2857db07365
                    amap_web_js_key: c8372d73045254a6542cf33a7db09193
                    home_coordinates: 109.005197,34.305664
                    current_coordinates: 108.902682,34.239787
                    converted_coordinates: false
                    frequent_routes:
                      - name: 家→公司
                        start: 109.005197,34.305664
                        end: 108.884925742879,34.214884955602
                        time: '12:00'
                        reverse_entity: device_tracker.ip15_94
                        reverse_entity_value: not_home
                      - name: 老家→西安家
                        start: 107.77535,32.99628
                        end: 109.005197,34.305664
                        reverse_entity: device_tracker.ip15_94
                        reverse_entity_value: home
                      - name: 老婆家→西安家
                        start: 108.430777,34.149208
                        end: 109.005197,34.305664
                        reverse_entity: device_tracker.ip15_94
                        reverse_entity_value: home
              - type: dynamic_icon
                name: 门禁 & 门磁
                show_badge: false
                loop_display: true
                rules:
                  - condition:
                      entity: binary_sensor.men_ci
                      operator: '=='
                      value: 'off'
                    icon: mdi:door-closed-lock
                    icon_text: 关
                    color: '#007b43'
                    name: 门磁
                  - condition:
                      entity: binary_sensor.men_ci
                      operator: '=='
                      value: 'on'
                    icon: mdi:door-open
                    icon_text: 开
                    color: '#f58220'
                    name: 门磁
                tap_action:
                  action: call-service
                  service: modern_room_card.show_free_layout_popup
                  service_data:
                    title: 门禁 和 门磁
                    width: 430px
                    popup_position: clone_button_down
                    tabs:
                      - name: 门禁
                        icon: mdi:door-closed
                        rows:
                          - row: 1
                            per_line: 2
                            title: 单元楼门禁 - 控制
                            show_more_info: popup_card
                            items:
                              - type: switch
                                name: 来电开锁
                                on_icon: mdi:bell-ring
                                on_color: '#b94047'
                                off_icon: mdi:bell
                                off_color: '#007b43'
                                entity: switch.giot_cn_1126348761_v64ksm_on_p_2_1
                                show_ios-switch: false
                                tap_action:
                                  action: toggle
                              - type: switch
                                name: 一键开门
                                entity: switch.giot_cn_1126348761_v64ksm_on_p_4_1
                                show_ios-switch: false
                                on_icon: mdi:key
                                off_icon: mdi:door-sliding-lock
                                on_color: '#b94047'
                                off_color: '#007b43'
                                tap_action:
                                  action: toggle
                          - row: 2
                            per_line: 2
                            title: 入户门 - 门磁
                            title_entities:
                              - type: sensor
                                entity: binary_sensor.men_ci
                                icon: mdi:door-open
                                name: 今天开门次数
                                show_name: false
                                way: today_usage_count
                                format: 今天开门{_default}次
                              - type: sensor
                                entity: binary_sensor.men_ci
                                icon: mdi:door-open
                                name: 最后一次时间
                                show_name: false
                                way: last_off_time
                                format: 最后一次{_default}
                            items:
                              - type: sensor
                                name: 入户门
                                entity: binary_sensor.men_ci
                                show_duration: input_boolean.show_duration
                                show_badge: false
                                on_icon: mdi:door-open
                                off_icon: mdi:door-closed-lock
                                on_color: '#b94047'
                                off_color: '#007b43'
                          - row: 3
                            per_line: 1
                            title: 门磁 - 时刻
                            show_title: false
